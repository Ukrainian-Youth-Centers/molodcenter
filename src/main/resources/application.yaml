server:
  port: 8081

spring:
  application:
    name: molodcenter

  datasource:
    url: jdbc:postgresql://${DB_HOST}/${DB_DATABASE}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

event:
  delete-after-days: 30

scheduler:
  event:
    limit: 5000
    cooldown: 1000
    cron: "0 0 3 * * *"